AWSTemplateFormatVersion: '2010-09-09'
Resources:
  DB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      PubliclyAccessible: true

  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      Size: 50
      AvailabilityZone: us-east-1a

  EncryptedVolume:
    Type: AWS::EC2::Volume
    Properties:
      Size: 50
      AvailabilityZone: us-east-1a
      Encrypted: true