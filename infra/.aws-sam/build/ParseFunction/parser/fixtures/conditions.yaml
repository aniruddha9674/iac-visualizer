AWSTemplateFormatVersion: '2010-09-09'
Description: Conditional resources and conditional properties

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  Bucket:
    Type: AWS::S3::Bucket

  ProdOnlyQueue:
    Type: AWS::SQS::Queue
    Condition: IsProd

  AlwaysQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !If [IsProd, prod-queue, dev-queue]

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: QueueAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !If
                  - IsProd
                  - !GetAtt ProdOnlyQueue.Arn
                  - !GetAtt AlwaysQueue.Arn