name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: install root deps
        run: npm ci
      - name: install backend deps
        run: cd backend && npm ci
      - name: run tests
        run: node scripts/test.cjs