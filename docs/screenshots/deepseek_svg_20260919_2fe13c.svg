<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-dotted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#879196"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#FFFFFF"/>

  <text x="800" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#232F3E">IaC Visualizer — Architecture</text>
  <text x="800" y="66" text-anchor="middle" font-size="13" fill="#687078">CloudFormation template analyzer · deterministic rule engine · Bedrock narration</text>

  <!-- AWS Cloud boundary -->
  <rect x="260" y="100" width="1300" height="840" fill="none" stroke="#616161" stroke-width="1.5" stroke-dasharray="6 4" rx="12"/>
  <text x="282" y="125" font-size="13" font-weight="600" fill="#616161">AWS Cloud</text>

  <!-- ===== Column 1: client-side ===== -->
  <rect x="40" y="180" width="180" height="80" rx="8" fill="#F7F7F7" stroke="#9E9E9E" stroke-width="1.5"/>
  <text x="130" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">User</text>
  <text x="130" y="234" text-anchor="middle" font-size="11" fill="#687078">Browser · Amplify URL</text>

  <rect x="40" y="320" width="180" height="80" rx="8" fill="#F7F7F7" stroke="#9E9E9E" stroke-width="1.5"/>
  <text x="130" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">GitHub Repo</text>
  <text x="130" y="374" text-anchor="middle" font-size="11" fill="#687078">main branch</text>

  <rect x="40" y="800" width="180" height="80" rx="8" fill="#F7F7F7" stroke="#9E9E9E" stroke-width="1.5"/>
  <text x="130" y="834" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">iac check</text>
  <text x="130" y="854" text-anchor="middle" font-size="11" fill="#687078">Local CLI · pre-commit · CI</text>

  <!-- ===== Column 2: Amplify ===== -->
  <rect x="280" y="180" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="280" y="180" width="6" height="80" fill="#FF9900" rx="3"/>
  <text x="370" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">AWS Amplify Hosting</text>
  <text x="370" y="234" text-anchor="middle" font-size="11" fill="#687078">React 19 · Vite</text>

  <!-- ===== Column 3: API Gateway (wide, top) ===== -->
  <rect x="520" y="180" width="520" height="80" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="520" y="180" width="6" height="80" fill="#FF9900" rx="3"/>
  <text x="780" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">API Gateway HTTP API</text>
  <text x="780" y="234" text-anchor="middle" font-size="11" fill="#687078">POST /parse · /analyze · /ask</text>

  <!-- ===== Lambda row (three side by side, no stacking) ===== -->
  <rect x="520" y="340" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="520" y="340" width="6" height="80" fill="#FF9900" rx="3"/>
  <text x="600" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">ParseFunction</text>
  <text x="600" y="394" text-anchor="middle" font-size="11" fill="#687078">Node 22 · ARM64</text>

  <rect x="700" y="340" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="700" y="340" width="6" height="80" fill="#FF9900" rx="3"/>
  <text x="780" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">AnalyzeFunction</text>
  <text x="780" y="394" text-anchor="middle" font-size="11" fill="#687078">Node 22 · ARM64</text>

  <rect x="880" y="340" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="880" y="340" width="6" height="80" fill="#FF9900" rx="3"/>
  <text x="960" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">AskFunction</text>
  <text x="960" y="394" text-anchor="middle" font-size="11" fill="#687078">Node 22 · ARM64</text>

  <!-- ===== Analysis Engine container ===== -->
  <rect x="520" y="500" width="520" height="280" rx="10" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="780" y="524" text-anchor="middle" font-size="12" font-weight="600" fill="#616161">Shared Analysis Engine</text>

  <rect x="545" y="540" width="470" height="40" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  <text x="780" y="565" text-anchor="middle" font-size="12" fill="#232F3E">Parser — js-yaml + CloudFormation schema</text>

  <rect x="545" y="590" width="470" height="40" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  <text x="780" y="615" text-anchor="middle" font-size="12" fill="#232F3E">Reference Walker — Ref · GetAtt · Sub · DependsOn</text>

  <rect x="545" y="640" width="470" height="40" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  <text x="780" y="665" text-anchor="middle" font-size="12" fill="#232F3E">Blast Radius — reverse BFS over dependency edges</text>

  <rect x="545" y="690" width="470" height="40" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  <text x="780" y="715" text-anchor="middle" font-size="12" fill="#232F3E">Rule Engine — 8 deterministic rules</text>

  <rect x="545" y="740" width="470" height="40" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  <text x="780" y="765" text-anchor="middle" font-size="12" fill="#232F3E">Cost Estimator — monthly heuristic</text>

  <!-- ===== Bedrock (right column) ===== -->
  <rect x="1100" y="340" width="280" height="140" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="1100" y="340" width="6" height="140" fill="#FF9900" rx="3"/>
  <text x="1240" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">Amazon Bedrock</text>
  <text x="1240" y="406" text-anchor="middle" font-size="11" fill="#687078">Nova Micro · us-east-1</text>
  <text x="1240" y="428" text-anchor="middle" font-size="10" fill="#879196">Messages API v1</text>

  <!-- ===== CloudFormation (below Bedrock) ===== -->
  <rect x="1100" y="540" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="1100" y="540" width="6" height="100" fill="#FF9900" rx="3"/>
  <text x="1240" y="576" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">CloudFormation Stack</text>
  <text x="1240" y="598" text-anchor="middle" font-size="11" fill="#687078">iac-visualizer</text>
  <text x="1240" y="616" text-anchor="middle" font-size="10" fill="#879196">provisioned via AWS SAM</text>

  <!-- ============= ARROWS ============= -->

  <!-- 1. User → Amplify -->
  <line x1="220" y1="220" x2="278" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="249" y="212" text-anchor="middle" font-size="10" fill="#333333">HTTPS</text>

  <!-- 2. Amplify → API Gateway -->
  <line x1="460" y1="220" x2="518" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="489" y="212" text-anchor="middle" font-size="10" fill="#333333">fetch</text>

  <!-- 3. API GW → ParseFunction -->
  <line x1="600" y1="260" x2="600" y2="338" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="305" font-size="10" fill="#333333">/parse</text>

  <!-- 4. API GW → AnalyzeFunction -->
  <line x1="780" y1="260" x2="780" y2="338" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="788" y="305" font-size="10" fill="#333333">/analyze</text>

  <!-- 5. API GW → AskFunction -->
  <line x1="960" y1="260" x2="960" y2="338" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="968" y="305" font-size="10" fill="#333333">/ask</text>

  <!-- 6. ParseFunction → Engine -->
  <line x1="600" y1="420" x2="600" y2="498" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. AnalyzeFunction → Engine -->
  <line x1="780" y1="420" x2="780" y2="498" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. AskFunction → Engine -->
  <line x1="960" y1="420" x2="960" y2="498" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. AnalyzeFunction → Bedrock (routed ABOVE the Lambda row) -->
  <path d="M 780 340 L 780 300 L 1240 300 L 1240 338" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="292" text-anchor="middle" font-size="10" fill="#333333">InvokeModel</text>

  <!-- 10. AskFunction → Bedrock (direct horizontal, no crossing) -->
  <line x1="1040" y1="380" x2="1098" y2="380" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1069" y="372" text-anchor="middle" font-size="10" fill="#333333">Invoke</text>

  <!-- 11. GitHub → Amplify (dotted, routed above the top row) -->
  <path d="M 220 340 L 250 340 L 250 140 L 370 140 L 370 178" fill="none" stroke="#879196" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-dotted)"/>
  <text x="300" y="132" font-size="10" fill="#879196">auto-build on push</text>

  <!-- 12. GitHub → CloudFormation (dotted, routed along the bottom) -->
  <path d="M 220 400 L 245 400 L 245 920 L 1240 920 L 1240 640" fill="none" stroke="#879196" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-dotted)"/>
  <text x="700" y="912" font-size="10" fill="#879196">sam deploy</text>

  <!-- 13. CLI → Engine (dotted, up from the bottom-left) -->
  <path d="M 130 800 L 130 780 L 520 780" fill="none" stroke="#879196" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-dotted)"/>
  <text x="300" y="772" font-size="10" fill="#879196">require() — same analysis modules</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(1000, 780)">
    <rect x="0" y="0" width="460" height="110" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1" rx="6"/>
    <text x="20" y="24" font-size="11" font-weight="600" fill="#616161">Legend</text>

    <line x1="20" y1="46" x2="54" y2="46" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="66" y="50" font-size="10" fill="#687078">runtime flow</text>

    <line x1="180" y1="46" x2="214" y2="46" stroke="#879196" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-dotted)"/>
    <text x="226" y="50" font-size="10" fill="#687078">build / deploy</text>

    <rect x="20" y="66" width="18" height="14" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
    <text x="46" y="78" font-size="10" fill="#687078">AWS service</text>

    <rect x="180" y="66" width="18" height="14" fill="#FAFAFA" stroke="#BDBDBD" stroke-dasharray="3 3"/>
    <text x="206" y="78" font-size="10" fill="#687078">module group</text>
  </g>
</svg>