AWSTemplateFormatVersion: '2010-09-09'
Description: Simple S3 + Lambda with role

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-data'

  ProcessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: process-data
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ProcessRole.Arn
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200 });
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket

  ProcessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${DataBucket.Arn}/*'

Outputs:
  BucketName:
    Value: !Ref DataBucket